[package]
name = "typed-id"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Type-safe ID newtypes via derive macro"
repository = "https://github.com/WyattAu/typed-id"
keywords = ["typed-id", "newtype", "uuid", "derive"]
categories = ["rust-patterns"]

[dependencies]
typed-id-derive = { path = "../typed-id-derive" }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
proptest = "1"
