[package]
exclude = ["/target"]
name = "typed-id-derive"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Derive macro for typedids"
repository = "https://github.com/WyattAu/typed-id"
readme = "README.md"
keywords = ["typedids", "derive", "macro", "uuid", "newtype"]
categories = ["rust-patterns"]

[lib]
proc-macro = true

[dependencies]
quote = "1"
syn = { version = "2", features = ["full"] }

[lints]
workspace = true
